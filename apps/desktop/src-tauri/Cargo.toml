[package]
name = "vesper"
version = "0.1.3"
description = "Personal Assistant named Vesper lived in this desktop application"
authors = ["you"]
edition.workspace = true
rust-version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vesper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cms-core.workspace = true
futures-util.workspace = true
my-workspace-logger.workspace = true
reqwest = { workspace = true, features = ["system-proxy"] }
useage.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tokio.workspace = true
tracing.workspace = true
ugos.workspace = true
vesper-credentials.workspace = true
tauri-plugin-notification = "2"
