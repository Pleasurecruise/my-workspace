[workspace]
members = [
  "apps/cli",
  "apps/desktop/src-tauri",
  "crates/cms",
  "crates/consumers",
  "crates/dashboard",
  "crates/database",
  "crates/games",
  "crates/inbox",
  "crates/github",
  "crates/ledger",
  "crates/link-preview",
  "crates/markdown",
  "crates/market-data",
  "crates/md-dialect",
  "crates/music",
  "crates/newspaper",
  "crates/oauth",
  "crates/quotes",
  "crates/service-status",
  "crates/social",
  "crates/todo",
  "crates/ugos",
  "crates/useage",
  "crates/vault",
  "crates/weather",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
unicode-segmentation = "1.13.3"
clap = "4.6"
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
icalendar = { version = "0.17.13", default-features = false, features = ["parser"] }
rrule = "0.14"
oauth2 = { version = "5", default-features = false }
httparse = "1.10"
oauth = { path = "crates/oauth" }
regex = "1.13.1"
url = "2.5"
aws-config = { version = "1", default-features = false, features = [
  "default-https-client",
  "rt-tokio",
] }
aws-credential-types = "1"
aws-sdk-s3 = { version = "1", default-features = false, features = [
  "default-https-client",
  "rt-tokio",
] }
aws-types = "1"
base64 = "0.23"
der = "0.8"
dotenvy = "0.15"
dom_query = "0.28"
html-escape = "0.2.15"
dirs = "7"
diesel = { version = "2.3", default-features = false, features = ["sqlite"] }
libsqlite3-sys = { version = "0.38", features = ["bundled"] }
dashboard = { path = "crates/dashboard" }
database = { path = "crates/database" }
futures-util = "0.3"
grammers-client = "0.10.0"
grammers-session = { version = "0.10.0", default-features = false, features = ["serde"] }
cms = { path = "crates/cms" }
consumers = { path = "crates/consumers" }
games = { path = "crates/games" }
hmac = "0.13"
inbox = { path = "crates/inbox" }
md-5 = "0.11"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
markdown = { path = "crates/markdown" }
md-dialect = { path = "crates/md-dialect" }
music = { path = "crates/music" }
ledger = { path = "crates/ledger" }
newspaper = { path = "crates/newspaper" }
quotes = { path = "crates/quotes" }
social = { path = "crates/social" }
todo = { path = "crates/todo" }
hex = "0.4"
heic = { version = "0.1.6", features = ["av1"] }
http = "1"
hyper-util = { version = "0.1", features = ["client-proxy-system"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
jiff = "0.2.35"
kamadak-exif = "0.6.1"
keyring = "4.2.0"
linkify = "0.11"
mermaid-svg = "0.7.0"
github = { path = "crates/github" }
link-preview = { path = "crates/link-preview" }
market-data = { path = "crates/market-data" }
service-status = { path = "crates/service-status" }
weather = { path = "crates/weather" }
pulldown-cmark = "0.13.4"
rand = "0.10"
rodio = "0.21"
useage = { path = "crates/useage" }
reqwest = { version = "0.13", default-features = false, features = [
  "cookies",
  "form",
  "json",
  "query",
  "rustls",
  "stream",
] }
rusqlite = { version = "0.40", features = ["bundled"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSWindow",
  "NSScreen",
  "NSResponder",
  "NSWorkspace",
  "NSAccessibility",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSGeometry",
  "NSThread",
] }
openssl = { version = "0.10", features = ["vendored"] }
percent-encoding = "2.3"
portable-pty = "0.9"
mime_guess = "2.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
sysinfo = "0.39.6"
svg-hush = "0.9.7"
tempfile = "3"
thiserror = "2"
thumbhash = "0.1"
tokio = { version = "1", features = [
  "fs",
  "io-util",
  "macros",
  "process",
  "rt-multi-thread",
  "sync",
  "time",
] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ugos = { path = "crates/ugos" }
vault = { path = "crates/vault" }
time = { version = "0.3", features = ["formatting", "local-offset", "macros", "parsing"] }
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2.5"

# Keep build-time dylibs loadable with the macOS 27 linker (rust-lang/rust#157750).
[profile.release.build-override]
strip = "none"

[patch.crates-io]
librespot-audio = { git = "https://github.com/crmne/librespot", branch = "fastpotify-0.8" }
librespot-core = { git = "https://github.com/crmne/librespot", branch = "fastpotify-0.8" }
librespot-metadata = { git = "https://github.com/crmne/librespot", branch = "fastpotify-0.8" }
librespot-playback = { git = "https://github.com/crmne/librespot", branch = "fastpotify-0.8" }
librespot-protocol = { git = "https://github.com/crmne/librespot", branch = "fastpotify-0.8" }
